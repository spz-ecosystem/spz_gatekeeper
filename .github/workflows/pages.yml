name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EMSCRIPTEN_VERSION: "6.0.3"

jobs:

  build_pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth 1 --branch ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
          echo ${GITHUB_WORKSPACE}/emsdk >> $GITHUB_PATH
          echo ${GITHUB_WORKSPACE}/emsdk/upstream/emscripten >> $GITHUB_PATH
          echo EMSDK=${GITHUB_WORKSPACE}/emsdk >> $GITHUB_ENV
          echo EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten >> $GITHUB_ENV

      - name: Configure CMake (Emscripten)
        run: |
          emcmake cmake -S cpp -B build-pages \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF

      - name: Build WASM
        run: |
          emmake cmake --build build-pages --parallel

      - name: Prepare Pages artifact
        run: |
          test -f build-pages/site/spz_gatekeeper.js
          test -f build-pages/site/spz_gatekeeper_wasm.js
          test -f build-pages/site/spz_gatekeeper_wasm.wasm
          test -f build-pages/site/index.html
          mkdir -p site
          cp -R build-pages/site/. site/

      - name: Generate SHA256 artifact manifest
        run: |
          cd site && sha256sum * > pages-artifact-sha256.txt && cat pages-artifact-sha256.txt

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
