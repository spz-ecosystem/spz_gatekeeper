name: Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build_pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Emscripten SDK
        run: |
          git clone https://github.com/emscripten-core/emsdk.git --depth 1      
          ./emsdk/emsdk install 3.1.56
          ./emsdk/emsdk activate 3.1.56
          echo ${GITHUB_WORKSPACE}/emsdk >> $GITHUB_PATH
          echo ${GITHUB_WORKSPACE}/emsdk/upstream/emscripten >> $GITHUB_PATH
          echo EMSDK=${GITHUB_WORKSPACE}/emsdk >> $GITHUB_ENV
          echo EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten >> $GITHUB_ENV

      - name: Configure CMake (Emscripten)
        run: |
          emcmake cmake -S cpp -B build-pages \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF

      - name: Build WASM
        run: |
          emmake cmake --build build-pages --parallel

      - name: Prepare Pages artifact
        run: |
          test -f build-pages/site/spz_gatekeeper.js
          test -f build-pages/site/index.html
          mkdir -p site
          cp -R build-pages/site/. site/

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy_pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_pages

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
