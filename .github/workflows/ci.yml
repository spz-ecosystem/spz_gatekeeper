# SPZ Gatekeeper CI - Based on spz2glb template

name: CI

# 固定 run 显示名，避免 Actions 从非 ASCII commit message 派生标题时出现问号
run-name: CI - ${{ github.ref_name }}

permissions:
  contents: read

on:
  push:
    branches: [ main, feature/spz-v2-profile-core, feature/spz-gatekeeper-2.0.2-r1, feature/spz-gatekeeper-2.0.2-r2, feature/spz-gatekeeper-2.0.2-r3, feature/spz-gatekeeper-2.0.2-r4, feature/spz-gatekeeper-2.0.2-r5, feature/spz-gatekeeper-2.0.2-r6, feature/spz-gatekeeper-2.0.4-r7, feature/spz-gatekeeper-2.0.4-r7.1, feature/spz-gatekeeper-2.0.5.1, fix/pages-deploy-on-tag, feature/spz-gatekeeper-encoding-defense ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  EMSCRIPTEN_VERSION: "6.0.3"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows-build
          - os: ubuntu-latest
            artifact_name: linux-build
          - os: macos-latest
            artifact_name: macos-build

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libzstd-dev cmake g++

      - name: Clone bench dataset
        if: matrix.os == 'ubuntu-latest'
        run: |
          git clone --depth 1 https://github.com/spz-ecosystem/spz-anime-text2scene-bench.git bench-data
          echo "SPZ_BENCH_DIR=${{ github.workspace }}/bench-data" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install zlib zstd cmake

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: matrix.os == 'windows-latest'

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cmake -S cpp -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=ON `
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF 2>&1 | Tee-Object -FilePath cmake-config.log
          Write-Output "=== Dependency Resolution ==="
          Select-String -Path cmake-config.log -Pattern "zlib|zstd|FetchContent|found" | Select-Object -First 20
          if (-not $?) { Write-Output "(check full cmake-config.log)" }

      - name: Configure CMake (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF 2>&1 | tee cmake-config.log
          echo "=== Dependency Resolution ==="
          grep -E "zlib|zstd|FetchContent|found" cmake-config.log | head -20

      - name: Configure CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cmake -S cpp -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zlib);$(brew --prefix zstd)" 2>&1 | tee cmake-config.log
          echo "=== Dependency Resolution ==="
          grep -E "zlib|zstd|FetchContent|found" cmake-config.log | head -20

      - name: Build (with verbose output)
        run: |
          cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Check build warnings
        if: always()
        shell: bash
        run: |
          echo "=== Build Warnings ==="
          if [ -f build.log ]; then
            grep -i "warning" build.log || echo "No warnings found"
          fi

      - name: Run Tests
        shell: bash
        run: |
          ctest --test-dir build --output-on-failure -C Release --timeout 60 -E "self_test|registry_cli|gen_fixture|compat_check|extension_integration"

      - name: Release gate (Ubuntu, real compat-check)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build/ci-gates
          ./build/spz_gatekeeper gen-fixture \
            --type 0xADBE0002 \
            --mode valid \
            --out build/ci-gates/release_valid.spz
          ./build/spz_gatekeeper compat-check build/ci-gates/release_valid.spz --json | tee build/ci-gates/release_gate.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('build/ci-gates/release_gate.json').read_text(encoding='utf-8'))
          if data.get('policy_mode') != 'release':
              raise SystemExit('release gate: policy_mode must be release')
          if data.get('verdict') == 'block' or data.get('final_verdict') == 'block':
              raise SystemExit('release gate: block verdict is not allowed')
          budgets = data.get('budgets', {})
          for key in ('peak_memory_mb', 'memory_growth_count'):
              if key not in budgets:
                  raise SystemExit(f'release gate: missing critical budget {key}')
              if budgets[key].get('declared') in (None, ''):
                  raise SystemExit(f'release gate: missing declared threshold for {key}')
          print('release gate checks passed')
          PY

      - name: Challenge gate (Ubuntu, manifest aggregation)
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p build/ci-gates
          ./build/spz_gatekeeper gen-fixture \
            --type 0xADBE0002 \
            --mode valid \
            --out build/ci-gates/challenge_pass.spz
          ./build/spz_gatekeeper gen-fixture \
            --type 0xADBE0002 \
            --mode invalid-size \
            --out build/ci-gates/challenge_block.spz

          cat > build/ci-gates/challenge_manifest.json <<'JSON'
          {
            "items": [
              {
                "path": "challenge_pass.spz",
                "scene_id": "scene-a",
                "group": "official",
                "split": "challenge",
                "difficulty": "easy"
              },
              {
                "path": "challenge_block.spz",
                "scene_id": "scene-b",
                "group": "official",
                "split": "challenge",
                "difficulty": "hard"
              }
            ]
          }
          JSON

          set +e
          ./build/spz_gatekeeper compat-check --manifest build/ci-gates/challenge_manifest.json --json > build/ci-gates/challenge_gate.json
          challenge_rc=$?
          set -e

          test "$challenge_rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('build/ci-gates/challenge_gate.json').read_text(encoding='utf-8'))
          if data.get('policy_mode') != 'challenge':
              raise SystemExit('challenge gate: policy_mode must be challenge')
          summary = data.get('summary', {})
          if summary.get('total') != 2:
              raise SystemExit('challenge gate: summary.total must be 2')
          if summary.get('block') != 1:
              raise SystemExit('challenge gate: summary.block must be 1')
          if 'grouped_summary' not in data:
              raise SystemExit('challenge gate: grouped_summary is required')
          if not isinstance(data.get('items'), list) or len(data['items']) != 2:
              raise SystemExit('challenge gate: expected exactly 2 manifest items')
          print('challenge gate checks passed')
          PY

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            build.log
            cmake-config.log
          retention-days: 7

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor

      - name: Scan GitHub Actions workflows
        run: zizmor --format plain --min-severity medium .github/workflows/

  # 乱码防护（移植自 TDAI 1.0 pr-ci.yml encoding-defense job，L1-L5 五层）
  # 适配：门卫源码含合法中文注释，L5 从"禁止非 ASCII"改为"乱码特征检测"；
  # 检测目标 = U+FFFD 替换符、无效 UTF-8、意外 BOM、.sh CRLF、编码绕过模式。
  encoding-defense:
    name: Encoding Defense (L1-L5)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: L5 - Detect garbled Unicode (U+FFFD / invalid UTF-8) in source
        # TDAI L5 扫描非 ASCII 字符；门卫源码含中文注释（合法），故改为检测乱码特征：
        # U+FFFD (EF BF BD) 替换符 = 编码损坏的直接证据；无效 UTF-8 序列同样拦截。
        # 排除 .spz 二进制数据文件（压缩内容天然含任意字节）。
        run: |
          echo "── Layer 5: mojibake scan in source files ──"
          violations=0
          while IFS= read -r -d '' f; do
            if ! python3 -c "open('$f','rb').read().decode('utf-8')" 2>/dev/null; then
              echo "  INVALID UTF-8: $f"
              violations=$((violations + 1))
              continue
            fi
            if grep -q $'\xef\xbf\xbd' "$f" 2>/dev/null; then
              echo "  U+FFFD (mojibake): $f"
              violations=$((violations + 1))
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './build' -prune -o \
            -path './build-*' -prune -o \
            -type f \( -name '*.cc' -o -name '*.h' -o -name '*.js' -o -name '*.html' \
                       -o -name '*.sh' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' \
                       -o -name '*.cmake' -o -name 'CMakeLists.txt' \) \
            -print0 2>/dev/null)
          if [ "$violations" -gt 0 ]; then echo "FAIL: $violations file(s) with encoding errors"; exit 1; fi
          echo "OK: $violations encoding violations (0 = clean)"

      - name: L4 - Verify .gitattributes encoding config
        run: |
          echo "── Layer 4: git pipeline encoding config ──"
          fails=0
          if [ -f .gitattributes ]; then
            if grep -q "eol=lf" .gitattributes 2>/dev/null; then
              echo "  .gitattributes declares eol=lf rules"
            else
              echo "  WARN: .gitattributes exists but no eol=lf"
              fails=$((fails + 1))
            fi
          else
            echo "  WARN: no .gitattributes found"
            fails=$((fails + 1))
          fi
          ENC=$(git config --local core.autocrlf 2>/dev/null || echo "unset")
          echo "  core.autocrlf: $ENC"
          if [ "$fails" -gt 0 ]; then echo "WARN: $fails pipeline encoding issue(s) (non-fatal)"; fi
          echo "OK: pipeline encoding check"

      - name: L3 - Detect shell encoding bypass patterns
        run: |
          echo "── Layer 3: shell encoding bypass scan ──"
          fails=0
          while IFS= read -r -d '' f; do
            if grep -q 'iconv.*UTF-16\|sed.*s/BOM\|dos2unix\|recode' "$f" 2>/dev/null; then
              echo "  SUSPICIOUS: $f may bypass encoding"
              fails=$((fails + 1))
            fi
          done < <(find . -path './.git' -prune -o -name '*.sh' -print 2>/dev/null | tr '\n' '\0')
          if [ "$fails" -gt 0 ]; then echo "WARN: $fails shell file(s) with bypass patterns (non-fatal)"; fi
          echo "OK: shell encoding bypass check"

      - name: L2 - Detect CRLF in index blobs (all types) and .sh worktree
        # (a) index blob CRLF (i/crlf) violates .gitattributes eol=lf — catches
        #     historical CRLF blobs and any newly committed CRLF, all file types;
        # (b) worktree .sh CRLF (existing) — WSL shbang requires LF.
        run: |
          echo "── Layer 2: CRLF scan (index blobs + .sh) ──"
          fails=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            echo "  INDEX-CRLF: $f"
            fails=$((fails + 1))
          done < <(git ls-files --eol | grep 'i/crlf' | awk -F '\t' '{print $NF}')
          while IFS= read -r -d '' f; do
            if grep -lU $'\r' "$f" 2>/dev/null | grep -q .; then
              echo "  CRLF: $f"
              fails=$((fails + 1))
            fi
          done < <(find . -path './.git' -prune -o -name '*.sh' -print 2>/dev/null | tr '\n' '\0')
          if [ "$fails" -gt 0 ]; then echo "FAIL: $fails file(s) with CRLF"; exit 1; fi
          echo "OK: all index blobs and .sh use LF"

      - name: L1 - Detect unexpected UTF-8 BOM in text sources
        run: |
          echo "── Layer 1: UTF-8 BOM scan ──"
          fails=0
          while IFS= read -r -d '' f; do
            header=$(od -A n -t x1 -N 3 "$f" 2>/dev/null | tr -d ' \n')
            if [ "$header" = "efbbbf" ]; then
              echo "  UNEXPECTED BOM: $f"
              fails=$((fails + 1))
            fi
          done < <(find . \
            -path './.git' -prune -o \
            -path './build' -prune -o \
            -path './build-*' -prune -o \
            -type f \( -name '*.cc' -o -name '*.h' -o -name '*.js' -o -name '*.html' \
                       -o -name '*.sh' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' \) \
            -print0 2>/dev/null)
          if [ "$fails" -gt 0 ]; then echo "FAIL: $fails file(s) with unexpected BOM"; exit 1; fi
          echo "OK: no unexpected BOM"

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache Emscripten SDK
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5.0.3
        with:
          path: /tmp/emsdk-cache
          key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-${{ runner.os }}

      - name: Setup Emscripten SDK
        run: |
          if [ -d /tmp/emsdk-cache/emsdk ]; then
            echo "Using cached emsdk"
            cp -r /tmp/emsdk-cache/emsdk ./emsdk
          else
            git clone https://github.com/emscripten-core/emsdk.git --depth 1 --branch ${{ env.EMSCRIPTEN_VERSION }}
            ./emsdk/emsdk install ${{ env.EMSCRIPTEN_VERSION }}
            mkdir -p /tmp/emsdk-cache
            cp -r ./emsdk /tmp/emsdk-cache/emsdk
          fi
          ./emsdk/emsdk activate ${{ env.EMSCRIPTEN_VERSION }}
          echo "${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_PATH"
          echo "${GITHUB_WORKSPACE}/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "EMSDK=${GITHUB_WORKSPACE}/emsdk" >> "$GITHUB_ENV"
          echo "EM_CONFIG=${GITHUB_WORKSPACE}/emsdk/.emscripten" >> "$GITHUB_ENV"

      - name: Configure CMake (Emscripten)
        run: |
          emcmake cmake -S cpp -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF \
            -DSPZ_GATEKEEPER_BUILD_WASM=ON

      - name: Build WASM
        shell: bash
        run: |
          emmake cmake --build build-wasm --parallel 2>&1 | tee build-wasm/wasm-build.log

      - name: Install WASM pre-check dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wabt

      - name: Run WASM pre-check (post-build)
        # P1/P5 already covered by Build WASM and the Playwright smoke test below.
        # This step adds P2 symbol export check, P3 artifact size check, P4 frontend consistency,
        # and P7 file integrity (UTF-8 validity + C++ syntax).
        continue-on-error: false
        run: bash scripts/wasm-pre-check.sh --skip-build --skip-smoke --build-dir build-wasm 2>&1 | tee build-wasm/wasm-pre-check.log

      - name: Upload WASM pre-check logs on failure
        if: failure()
        run: |
          test -f build-wasm/wasm-build.log && tail -50 build-wasm/wasm-build.log || echo "no wasm-build.log"
          test -f build-wasm/wasm-pre-check.log && cat build-wasm/wasm-pre-check.log || echo "no wasm-pre-check.log"
          test -f build-wasm/wasm-exports.txt && cat build-wasm/wasm-exports.txt || echo "no wasm-exports.txt"
          test -f build-wasm/wasm-binary.wasm && ls -la build-wasm/wasm-binary.wasm || echo "no wasm-binary.wasm"

      - name: Build native fixture generator (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev libzstd-dev cmake g++
          cmake -S cpp -B build-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSPZ_GATEKEEPER_BUILD_BENCHMARK_TESTS=OFF
          cmake --build build-native --parallel

      - name: Generate synthetic fixtures for browser smoke
        run: |
          mkdir -p build-wasm/site
          ./build-native/spz_gatekeeper gen-fixture \
            --type 0xADBE0002 \
            --mode valid \
            --format v4 \
            --out build-wasm/site/synthetic_valid.spz
          ./build-native/spz_gatekeeper gen-fixture \
            --type 0xADBE0002 \
            --mode valid \
            --format v3 \
            --out build-wasm/site/synthetic_v3.spz
          cp tests/fixtures/classroom_anime_v4.spz build-wasm/site/real_v4.spz
          cp tests/fixtures/classroom_anime_v3.spz build-wasm/site/real_v3.spz
          ls -lh build-wasm/site/*.spz

      - name: Verify WASM artifact
        run: |
          test -f build-wasm/site/spz_gatekeeper.js
          test -f build-wasm/site/spz_gatekeeper_wasm.js
          test -f build-wasm/site/spz_gatekeeper_wasm.wasm
          test -f build-wasm/site/index.html
          test -f build-wasm/site/synthetic_valid.spz
          test -f build-wasm/site/synthetic_v3.spz
          test -f build-wasm/site/real_v4.spz
          test -f build-wasm/site/real_v3.spz

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: |
          npm install --no-save @playwright/test@1.52.0
          npx playwright install --with-deps chromium

      - name: npm audit (supply chain)
        shell: bash
        continue-on-error: true
        run: |
          npm audit --audit-level=high

      - name: Run WASM browser smoke test
        # T54: 边界测试 — kMaxSpzBytes=30MB + 前端 24MB/30MB 检查
        # 30MB+ 大文件 smoketest 不在 CI 执行（生成 24-31MB 文件耗时）
        # 验证方式: frontend index.html 硬上限拒绝 + WASM kMaxSpzBytes 双重防线
        # Retry up to 3 times to mitigate transient failures (network timeouts, port conflicts)
        run: |
          python3 -m http.server 4173 --directory build-wasm/site > wasm-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill ${SERVER_PID}' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then
              break
            fi
            sleep 1
          done
          for attempt in 1 2 3; do
            echo "Smoke test attempt $attempt"
            if node tests/wasm_smoke_test.mjs http://127.0.0.1:4173 build-wasm/site/synthetic_valid.spz build-native/spz_gatekeeper | tee wasm-smoke.log; then
              echo "Smoke test passed on attempt $attempt"
              break
            fi
            if [ $attempt -eq 3 ]; then
              echo "Smoke test failed after 3 attempts"
              exit 1
            fi
            echo "Smoke test attempt $attempt failed, retrying..."
            sleep 2
          done

      - name: Upload WASM smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-smoke-logs
          path: |
            wasm-http.log
            wasm-smoke.log
            wasm-smoke-failure.png
            build-wasm/wasm-build.log
            build-wasm/wasm-pre-check.log
          retention-days: 7

      - name: WASM post-build failure summary
        if: failure()
        shell: bash
        run: |
          echo "=== WASM Pre-Check Failure Summary ==="
          for stage in P0_ENV P1_BUILD P2_SYMBOL P2_EMSCRIPTEN_PREFIX P3_ARTIFACT P4_FRONTEND P5_SMOKE P6_WORKFLOW P7_INTEGRITY; do
            echo "--- $stage ---"
            grep -E "\\b${stage}\\b" build-wasm/wasm-pre-check.log 2>/dev/null || echo "(no log for $stage)"
          done
          echo "=== WASM Export Table (if available) ==="
          test -f build-wasm/wasm-exports.txt && head -30 build-wasm/wasm-exports.txt || echo "(no wasm-exports.txt)"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-build
          path: build-wasm/site

  deploy_pages:
    name: Deploy Pages
    needs: [wasm, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download WASM artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v5
        with:
          name: wasm-build
          path: site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
